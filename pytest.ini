[pytest]
minversion = 8.0
addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: quick sanity checks
    regression: full regression suite
    login: tests related to login/authentication
    inventory: tests related to the products/inventory page
    cart: tests related to the shopping cart
    checkout: tests related to the checkout flow

log_cli = true
log_cli_level = INFO
